    <!-- Apply the saved theme (light by default) before first paint so there is no light flash in night mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("np-theme");
          var dark = t === "dark"; /* first visit = light; dark only if the visitor chose it */
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#050b18");
          }
        } catch (e) {}
      })();
    </script>
